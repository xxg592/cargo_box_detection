pointcloud_to_laserscan:
  ros__parameters:
    # The RGB-D cloud arrives in cargo_robot/base_link/front_depth_camera.
    target_frame: base_link
    # Keep this well above one cloud period (clouds arrive at ~1-5 Hz
    # depending on the Gazebo real-time factor).
    transform_tolerance: 1.0
    # Keep only points between the floor and the top of a cargo box.
    min_height: 0.05
    max_height: 1.00
    # The RGB-D camera has a 60 deg horizontal FOV.
    angle_min: -0.5236
    angle_max: 0.5236
    angle_increment: 0.0087
    scan_time: 0.2
    range_min: 0.15
    range_max: 5.00
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10